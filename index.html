<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111418">
  <title>Mi Plan · Inglés + IT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <header><div><h1>Mi Plan</h1><span>Inglés + IT</span></div><div id="hstats" class="hstats"></div></header>
  <main>
    <section class="view" id="v-auth">
      <div class="card">
        <h2>Entrar</h2>
        <p class="muted">Tu progreso se guarda en tu cuenta y lo ves igual en el celu y en la PC.</p>
        <form id="authform">
          <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
          <input type="password" id="auth-pass" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="current-password" minlength="8" required>
          <div class="row"><button class="btn" type="submit" id="auth-login">Entrar</button><button class="ghost" type="button" id="auth-signup">Crear cuenta</button></div>
        </form>
        <p id="auth-msg" class="authmsg" role="status"></p>
        <p class="muted small">¿Primera vez? Escribí tu email y una contraseña nueva y tocá <b>Crear cuenta</b>. Después vas a usar <b>Entrar</b>.</p>
      </div>
    </section>
    <section class="view" id="v-hoy" hidden></section>
    <section class="view" id="v-lectura" hidden></section>
    <section class="view" id="v-en" hidden></section>
    <section class="view" id="v-it" hidden></section>
    <section class="view" id="v-log" hidden></section>
    <section class="view" id="v-prompts" hidden></section>
    <section class="view" id="v-ajustes" hidden></section>
  </main>
  <nav>
    <button data-go="hoy" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></button>
    <button data-go="lectura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span>Lectura</span></button>
    <button data-go="en"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c0 5 3 8 6 9M11 5c0 4-3 8-7 9"/><path d="M13 21l4-10 4 10M14.5 17.5h5"/></svg><span>Inglés</span></button>
    <button data-go="it"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>IT</span></button>
    <button data-go="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg><span>Bitácora</span></button>
    <button data-go="prompts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Prompts</span></button>
    <button data-go="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Perfil</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script src="content-en.js"></script>
  <script src="content-it.js"></script>
  <script src="content-extra.js"></script>
  <script src="why.js"></script>
  <script src="diagrams.js"></script>
  <script src="app.js"></script>
</body>
</html>
